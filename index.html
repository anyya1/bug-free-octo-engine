<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
</head>
<body>
    <h1>Прокат настольных игр</h1>

<label for="onlyFree">
  <input type="checkbox" id="onlyFree">
  Только свободные
</label>

<label for="nameGame">Название игры</label>
<input id="nameGame" type="text">
<label for="numberPlayer">Число игроков</label>
<input id="numberPlayer" type="number">
<button id="gameButton" type="button">Добавить игру</button>


<ul id="gameList"></ul>

<label for="gameSelect">Игра</label>
<select id="gameSelect"></select>

<label for="borrowerName">Имя посетителя</label>
<input id="borrowerName" type="text">
<button id="borrowButton" type="button">Выдать</button>
<button id="returnButton" type="button">Вернуть</button>
<p id="message"></p>
</body>
</html>
